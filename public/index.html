<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mafia</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0d1224; --bg2: #151c36; --card: #1b2444; --line: #2a3563;
    --text: #eef1ff; --muted: #8b94bd; --accent: #7c8cff; --danger: #ff5d6c;
    --ok: #4ad295; --gold: #ffc65c; --sky: linear-gradient(180deg, #121a3a 0%, #0d1224 70%);
  }
  body[data-phase="day"], body[data-phase="vote"], body[data-phase="kamikaze"] {
    --bg: #1d1712; --bg2: #2a2017; --card: #33271c; --line: #4a3a29;
    --text: #fff6ea; --muted: #c2a98c; --accent: #ffa94d;
    --sky: linear-gradient(180deg, #4a2f1a 0%, #1d1712 70%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--sky), var(--bg); background-attachment: fixed;
    color: var(--text); font: 15px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    transition: background .6s, color .6s;
  }
  #app { max-width: 560px; margin: 0 auto; padding: 16px 16px 32px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  #phase { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  #sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  #timer {
    min-width: 64px; text-align: center; padding: 8px 10px; border-radius: 14px;
    background: var(--card); border: 1px solid var(--line); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px;
  }
  #timer.low { color: var(--danger); animation: pulse 1s infinite; }
  #timer:empty { display: none; }
  @keyframes pulse { 50% { transform: scale(1.06); } }

  .rolecard { perspective: 900px; margin-bottom: 14px; cursor: pointer; user-select: none; }
  .rolecard-inner { display: grid; transition: transform .5s; transform-style: preserve-3d; }
  .rolecard.open .rolecard-inner { transform: rotateY(180deg); }
  .face {
    grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; padding: 14px 16px;
    display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); min-height: 92px;
  }
  .front { background: repeating-linear-gradient(45deg, var(--card), var(--card) 10px, var(--bg2) 10px, var(--bg2) 20px); justify-content: center; color: var(--muted); font-weight: 600; }
  .back { background: var(--card); transform: rotateY(180deg); }
  .back .big { font-size: 40px; flex: none; }
  .back b { font-size: 18px; display: block; margin-bottom: 2px; }
  .back small { color: var(--muted); font-size: 13px; display: block; }
  .side-mafia .back { background: linear-gradient(135deg, #4a1420, var(--card)); }
  .side-qotil .back { background: linear-gradient(135deg, #3b1a4a, var(--card)); }
  .side-suidsid .back { background: linear-gradient(135deg, #3d3a14, var(--card)); }

  #hint { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; }
  #hint:empty { display: none; }

  .modes { display: flex; gap: 8px; margin-bottom: 12px; }
  .modes:empty { display: none; }
  .modes button { flex: 1; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
  .player {
    position: relative; background: var(--card); border: 2px solid transparent; border-radius: 16px;
    padding: 12px 6px 10px; text-align: center; transition: transform .15s, border-color .15s, opacity .3s;
  }
  .player.selectable { cursor: pointer; border-color: var(--line); }
  .player.selectable:active { transform: scale(.95); }
  .player.selected { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .player.dead { opacity: .45; filter: grayscale(.8); }
  .player.won { opacity: 1; filter: none; border-color: var(--gold); }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%; margin: 0 auto 6px; display: grid; place-items: center;
    font-weight: 700; font-size: 20px; color: #fff; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 11px; color: var(--muted); margin-top: 2px; min-height: 15px; }
  .badge { position: absolute; top: 6px; right: 6px; font-size: 14px; }
  .badge.left { right: auto; left: 6px; }
  .votes {
    position: absolute; top: -6px; right: -6px; background: var(--danger); color: #fff; border-radius: 999px;
    min-width: 22px; height: 22px; padding: 0 6px; display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  .picks { font-size: 11px; color: var(--danger); margin-top: 2px; }
  .voters { font-size: 11px; color: var(--accent); margin-top: 3px; line-height: 1.3; word-break: break-word; }
  .skipline { font-size: 12px; color: var(--muted); text-align: center; }

  #actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  #actions:empty { display: none; }
  button.btn {
    appearance: none; border: 0; border-radius: 14px; padding: 14px; font: inherit; font-weight: 700;
    background: var(--accent); color: #10131f; cursor: pointer;
  }
  button.btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  button.btn.small { padding: 6px 10px; font-size: 12px; border-radius: 10px; }
  button.btn:disabled { opacity: .45; }

  .panel { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; margin-top: 14px; }
  .panel[hidden] { display: none; }
  .panel h3 { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .row:last-child { border-bottom: 0; }
  .list { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow: auto; }
  .list li { padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .list li:last-child { border-bottom: 0; }
  .list .r { color: var(--muted); font-size: 11px; margin-right: 4px; }

  .winner { text-align: center; padding: 18px; border-radius: 18px; margin-bottom: 14px; font-size: 20px; font-weight: 800; }
  .winner.civil { background: linear-gradient(135deg, #1d6b4a, #134034); }
  .winner.mafia { background: linear-gradient(135deg, #7a1c2b, #3d0f17); }
  .winner.qotil { background: linear-gradient(135deg, #5a2378, #2a1038); }
  .winner.draw { background: linear-gradient(135deg, #4a4f66, #262a3a); }
  .winner small { display: block; font-size: 14px; font-weight: 600; margin-top: 6px; opacity: .9; }

  #overlay {
    position: fixed; inset: 0; background: var(--bg); display: grid; place-items: center; text-align: center;
    padding: 24px; z-index: 10; color: var(--muted);
  }
  #overlay[hidden] { display: none; }
  #overlay .logo { font-size: 56px; margin-bottom: 10px; }
  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(120px); background: var(--danger);
    color: #fff; padding: 10px 16px; border-radius: 12px; font-weight: 600; transition: transform .25s; z-index: 20; max-width: 90%;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* ---------- Fon: osmon ---------- */
  #app { position: relative; z-index: 1; }
  #sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  #stars, #clouds { position: absolute; inset: 0; transition: opacity 1.2s; }
  .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; animation: twinkle 3s infinite ease-in-out; }
  @keyframes twinkle { 0%, 100% { opacity: .2; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.3); } }
  .orb { position: absolute; top: 10px; right: 96px; width: 46px; height: 46px; border-radius: 50%; transition: transform 1.4s cubic-bezier(.3,.8,.3,1), opacity 1.2s; }
  #moon { background: radial-gradient(circle at 35% 35%, #fffbe8, #d9d3b4 60%, #b3ab88); box-shadow: 0 0 40px 10px rgba(255,250,220,.18); }
  #moon::after { content: ''; position: absolute; width: 9px; height: 9px; top: 25px; left: 12px; border-radius: 50%; background: rgba(0,0,0,.08); box-shadow: 22px -16px 0 -3px rgba(0,0,0,.07); }
  #sun { background: radial-gradient(circle, #fff3c4, #ffc65c 55%, #ff9a3c); box-shadow: 0 0 60px 20px rgba(255,170,60,.35); animation: spin 30s linear infinite; }
  @keyframes spin { to { rotate: 360deg; } }
  .cloud { position: absolute; height: 26px; border-radius: 20px; background: rgba(255,240,220,.08); animation: drift linear infinite; }
  .cloud::before, .cloud::after { content: ''; position: absolute; background: inherit; border-radius: 50%; }
  .cloud::before { width: 34px; height: 34px; left: 14px; top: -16px; }
  .cloud::after { width: 26px; height: 26px; left: 40px; top: -10px; }
  @keyframes drift { from { transform: translateX(-140px); } to { transform: translateX(110vw); } }
  body:not([data-phase="day"]):not([data-phase="vote"]):not([data-phase="kamikaze"]) #sun,
  body:not([data-phase="day"]):not([data-phase="vote"]):not([data-phase="kamikaze"]) #clouds { opacity: 0; transform: translateY(160px); }
  body[data-phase="day"] #moon, body[data-phase="vote"] #moon, body[data-phase="kamikaze"] #moon,
  body[data-phase="day"] #stars, body[data-phase="vote"] #stars, body[data-phase="kamikaze"] #stars { opacity: 0; transform: translateY(160px); }

  /* ---------- Faza sahnasi ---------- */
  #scene {
    position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; text-align: center; padding: 24px;
    opacity: 0; pointer-events: none; transition: opacity .45s;
  }
  #scene.show { opacity: 1; pointer-events: auto; }
  #scene.night { background: radial-gradient(ellipse at 50% 30%, #1c2757, #070a18 75%); color: #eef1ff; }
  #scene.day { background: radial-gradient(ellipse at 50% 90%, #ffb057, #b8552a 45%, #3a1f12 90%); color: #fff6ea; }
  #scene.vote { background: radial-gradient(ellipse at 50% 40%, #5b3a1e, #1d1712 80%); color: #fff6ea; }
  #scene.kamikaze { background: radial-gradient(circle at 50% 45%, #ff7a2f, #6b1408 55%, #150503); color: #fff; }
  #scene.end { background: radial-gradient(ellipse at 50% 30%, #2d2a52, #0b0a18 80%); color: #fff; }
  #scene.end.civil { background: radial-gradient(ellipse at 50% 30%, #1d6b4a, #07140f 80%); }
  #scene.end.mafia { background: radial-gradient(ellipse at 50% 30%, #7a1c2b, #12050a 80%); }
  #scene.end.qotil { background: radial-gradient(ellipse at 50% 30%, #5a2378, #0f0516 80%); }
  .scene-icon { font-size: 92px; line-height: 1; margin-bottom: 14px; }
  #scene.show .scene-icon { animation: rise 1.1s cubic-bezier(.2,.9,.3,1.2) both; }
  #scene.kamikaze.show .scene-icon { animation: boom .9s ease-out both; }
  #scene.kamikaze.show { animation: shake .5s .2s 2; }
  @keyframes rise { from { opacity: 0; transform: translateY(80px) scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes boom { 0% { transform: scale(.2); opacity: 0; } 60% { transform: scale(1.5); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .scene-title { font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
  .scene-sub { opacity: .75; margin-top: 4px; }
  #scene.show .scene-title, #scene.show .scene-sub { animation: fadeUp .6s .35s both; }
  .scene-events { margin: 22px auto 0; max-width: 420px; display: flex; flex-direction: column; gap: 8px; }
  .scene-events div {
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 10px 14px;
    font-size: 15px; opacity: 0;
  }
  #scene.show .scene-events div { animation: fadeUp .55s both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .scene-tap { position: absolute; bottom: 24px; left: 0; right: 0; font-size: 12px; opacity: .5; }

  /* ---------- Konfetti ---------- */
  .confetti { position: fixed; top: -12px; width: 9px; height: 14px; z-index: 31; pointer-events: none; border-radius: 2px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(720deg); opacity: .7; } }

  /* ---------- Kartalar ---------- */
  .player.enter { animation: pop .45s cubic-bezier(.2,.9,.3,1.4) both; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } }
  .player.dying { animation: die 1.4s ease-in both; }
  .player.dying::after { content: '💀'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 44px; animation: skull 1.4s both; }
  @keyframes die { 0% { transform: none; filter: none; opacity: 1; } 20% { transform: rotate(-4deg) scale(1.05); } 40% { transform: rotate(4deg); } 100% { transform: none; filter: grayscale(.8); opacity: .45; } }
  @keyframes skull { 0% { opacity: 0; transform: translateY(-30px) scale(.4); } 30% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
  .votes.bump { animation: bump .4s; }
  @keyframes bump { 50% { transform: scale(1.5); } }
  .player.selected .avatar { animation: glow 1.6s infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 40%, transparent); } }
  #timer { position: relative; }
  #timer::before {
    content: ''; position: absolute; inset: -3px; border-radius: 16px; z-index: -1;
    background: conic-gradient(var(--accent) calc(var(--p, 0) * 1%), transparent 0);
  }
  #timer.low::before { background: conic-gradient(var(--danger) calc(var(--p, 0) * 1%), transparent 0); }
  .spect { display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 12px; }
  .watch-banner { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body data-phase="lobby">
<div id="sky"><div id="stars"></div><div id="clouds"></div><div id="moon" class="orb"></div><div id="sun" class="orb"></div></div>
<div id="scene"><div><div class="scene-icon" id="sceneIcon"></div><div class="scene-title" id="sceneTitle"></div><div class="scene-sub" id="sceneSub"></div><div class="scene-events" id="sceneEvents"></div></div><div class="scene-tap">Yopish uchun bosing</div></div>
<div id="app">
  <header>
    <div><div id="phase">Mafia</div><div id="sub"></div></div>
    <div id="timer"></div>
  </header>
  <div id="winner"></div>
  <div id="rolecard" class="rolecard" hidden>
    <div class="rolecard-inner">
      <div class="face front">🂠 Rolingizni ko'rish uchun bosing</div>
      <div class="face back"><div class="big" id="roleEmoji"></div><div><b id="roleName"></b><small id="roleInfo"></small></div></div>
    </div>
  </div>
  <div id="watch" class="watch-banner" hidden>👀 Siz tomosha qilyapsiz. Yangi o'yinga guruhda /newgame orqali qo'shilasiz.</div>
  <div id="hint"></div>
  <div id="modes" class="modes"></div>
  <div id="grid"></div>
  <div id="actions"></div>
  <div id="notes" class="panel" hidden><h3>📨 Shaxsiy xabarlar</h3><ul id="noteList" class="list"></ul></div>
  <div id="checks" class="panel" hidden><h3>🕵️ Tekshiruvlar</h3><div id="checkList"></div></div>
  <div class="panel"><h3>Voqealar</h3><ul id="log" class="list"></ul></div>
</div>
<div id="overlay"><div><div class="logo">🎭</div><div id="overlayText">Ulanmoqda…</div></div></div>
<div id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

const $ = (id) => document.getElementById(id);
let state = null, endAt = null, ws = null, retry = 0, fatal = false;
let komMode = 'check';   // Komissar: 'check' yoki 'shoot'
let pending = [];        // Jurnalist tanlayotgan ikki kishi
let lastKey = '';        // faza o'zgarganini bilish uchun

const MAFIA_TEAM = ['don', 'mafia', 'advokat'];
const fx = { enter: new Set(), dying: new Set(), bump: new Set() };
let sceneOpen = false, sceneTimer = null;

// ---------- Osmon: yulduzlar va bulutlar ----------
(function buildSky() {
  const stars = $('stars');
  for (let i = 0; i < 70; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() < .15 ? 3 : 2;
    Object.assign(s.style, {
      left: `${Math.random() * 100}%`, top: `${Math.random() * 70}%`, width: `${size}px`, height: `${size}px`,
      animationDelay: `${Math.random() * 3}s`, animationDuration: `${2 + Math.random() * 3}s`,
    });
    stars.append(s);
  }
  const clouds = $('clouds');
  for (let i = 0; i < 4; i++) {
    const c = document.createElement('div');
    c.className = 'cloud';
    Object.assign(c.style, {
      top: `${30 + i * 70 + Math.random() * 30}px`, width: `${70 + Math.random() * 50}px`,
      animationDuration: `${40 + Math.random() * 40}s`, animationDelay: `${-Math.random() * 60}s`,
    });
    clouds.append(c);
  }
})();

// ---------- Faza sahnasi ----------
const WIN_TEXT = { civil: "Tinch aholi g'alaba qozondi!", mafia: "Mafia g'alaba qozondi!", qotil: "Qotil g'alaba qozondi!", draw: 'Durang' };
const WIN_ICON = { civil: '🎉', mafia: '🎩', qotil: '🔪', draw: '🤝' };

function showScene(s) {
  const sc = $('scene');
  const me = s.players.find((p) => p.id === s.me.id);
  let icon, title, sub = '', cls = s.phase;
  if (s.phase === 'night') { icon = '🌙'; title = `${s.round}-tun`; sub = 'Shahar uxlaydi…'; tg?.HapticFeedback?.notificationOccurred('warning'); }
  else if (s.phase === 'day') { icon = '☀️'; title = 'Tong otdi'; sub = `${s.round}-kun`; tg?.HapticFeedback?.notificationOccurred('success'); }
  else if (s.phase === 'vote') { icon = '🗳'; title = 'Ovoz berish'; sub = 'Kimni osamiz?'; tg?.HapticFeedback?.notificationOccurred('warning'); }
  else if (s.phase === 'kamikaze') { icon = '💣'; title = 'Kamikadze!'; tg?.HapticFeedback?.impactOccurred('heavy'); }
  else if (s.phase === 'end') {
    icon = WIN_ICON[s.winner] || '⛔'; title = WIN_TEXT[s.winner] || "O'yin to'xtatildi";
    if (s.winner) cls += ` ${s.winner}`;
    if (me) sub = me.winner ? 'Siz yutdingiz! 🏆' : me.hero ? 'Siz qahramonsiz! 🎖' : 'Bu safar omad kulmadi';
    if (s.winner && s.winner !== 'draw') confetti(s.winner);
  } else return render();

  sc.className = cls;
  $('sceneIcon').textContent = icon;
  $('sceneTitle').textContent = title;
  $('sceneSub').textContent = sub;
  const ev = $('sceneEvents'); ev.replaceChildren();
  (s.events || []).slice(-6).forEach((text, i) => {
    const d = document.createElement('div');
    d.textContent = text;
    d.style.animationDelay = `${0.9 + i * 0.7}s`;
    ev.append(d);
  });
  void sc.offsetWidth; // animatsiyani qaytadan boshlash
  sc.classList.add('show');
  sceneOpen = true;
  render();
  clearTimeout(sceneTimer);
  const n = (s.events || []).length;
  sceneTimer = setTimeout(hideScene, Math.min(2600 + n * 900, s.phase === 'end' ? 9000 : 7500));
}

function hideScene() {
  clearTimeout(sceneTimer);
  if (!sceneOpen) return;
  sceneOpen = false;
  $('scene').classList.remove('show');
  render(); // o'lim animatsiyasi sahna yopilgandan keyin ko'rinsin
}
$('scene').onclick = hideScene;

function confetti(side) {
  const colors = { civil: ['#4ad295', '#ffc65c', '#7c8cff', '#fff'], mafia: ['#ff5d6c', '#1b1b1b', '#ffc65c', '#fff'], qotil: ['#b45cff', '#ff5d6c', '#fff'] }[side];
  for (let i = 0; i < 90; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    Object.assign(c.style, {
      left: `${Math.random() * 100}vw`, background: colors[i % colors.length],
      animationDuration: `${2.5 + Math.random() * 2.5}s`, animationDelay: `${Math.random() * 1.5}s`,
      transform: `rotate(${Math.random() * 360}deg)`,
    });
    document.body.append(c);
    setTimeout(() => c.remove(), 6500);
  }
}
const label = (r) => `${state.roles[r].emoji} ${state.roles[r].name}`;

// ---------- Ulanish ----------
function authMessage() {
  const qs = new URLSearchParams(location.search);
  if (!tg?.initData && qs.get('dev')) {
    return { type: 'auth', dev: { id: qs.get('uid') || Math.floor(Math.random() * 1e6), name: qs.get('name') || 'Test', game: qs.get('game') || 'dev' } };
  }
  return { type: 'auth', initData: tg?.initData || '' };
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => { retry = 0; ws.send(JSON.stringify(authMessage())); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'state') {
      const prev = state;
      state = m;
      endAt = m.remaining != null ? Date.now() + m.remaining : null;
      const key = `${m.phase}:${m.round}`;
      if (key !== lastKey) {
        lastKey = key;
        pending = [];
        komMode = m.me.choice?.mode || 'check';
      }
      // Animatsiyalar uchun nima o'zgarganini aniqlaymiz
      if (prev) {
        const was = new Map(prev.players.map((p) => [p.id, p]));
        for (const p of m.players) {
          const old = was.get(p.id);
          if (!old) fx.enter.add(p.id);
          else if (old.alive && !p.alive) fx.dying.add(p.id);
          if (old && p.votes > old.votes) fx.bump.add(p.id);
        }
      }
      $('overlay').hidden = true;
      if (prev && m.eventsId !== prev.eventsId) showScene(m);
      else render();
    } else if (m.type === 'error') {
      if (m.code) { fatal = true; showOverlay(m.message); }
      else toast(m.message);
    }
  };
  ws.onclose = (e) => {
    if (fatal) return;
    if (e.code === 4000) { fatal = true; return showOverlay("O'yin yopildi. Guruhda /newgame yozing."); }
    showOverlay('Aloqa uzildi, qayta ulanmoqda…');
    setTimeout(connect, Math.min(1000 * 2 ** retry++, 10000));
  };
}
const sendMsg = (m) => ws?.readyState === 1 && ws.send(JSON.stringify(m));

function showOverlay(text) { $('overlayText').textContent = text; $('overlay').hidden = false; }
let toastTimer;
function toast(text) {
  const t = $('toast'); t.textContent = text; t.classList.add('show');
  tg?.HapticFeedback?.notificationOccurred('error');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

// ---------- Yordamchilar ----------
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function colorFor(id) { return `hsl(${(Number(id) * 47) % 360} 55% 45%)`; }
function avatar(p) {
  const a = el('div', 'avatar');
  a.style.background = colorFor(p.id);
  const initials = p.name.split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  if (p.photo) {
    const img = new Image(); img.src = p.photo; img.alt = '';
    img.onerror = () => { a.textContent = initials; };
    a.append(img);
  } else a.textContent = initials;
  return a;
}
const nameOf = (id) => state.players.find((p) => p.id === id)?.name ?? '?';

function canTarget(p) {
  const s = state, me = s.me, role = me.role;
  if (!me.canAct || !p.alive) return false;
  if (s.phase === 'vote' || s.phase === 'kamikaze') return p.id !== me.id;
  if (s.phase === 'night') {
    if (role === 'doktor') return true;
    if (p.id === me.id) return false;
    if ((role === 'don' || role === 'mafia') && MAFIA_TEAM.includes(p.role)) return false;
    return true;
  }
  return false;
}

function onPick(p) {
  const s = state;
  tg?.HapticFeedback?.selectionChanged();
  if (s.phase === 'vote') return sendMsg({ type: 'vote', target: p.id });
  if (s.phase === 'kamikaze') return sendMsg({ type: 'kamikaze', target: p.id });
  if (s.me.role === 'jurnalist') {
    pending = pending.includes(p.id) ? pending.filter((x) => x !== p.id) : [...pending, p.id].slice(-2);
    if (pending.length === 2) sendMsg({ type: 'act', targets: pending });
    return render();
  }
  sendMsg({ type: 'act', targets: [p.id], mode: komMode });
}

const NIGHT_HINT = {
  don: "Kimni o'ldiramiz? 🎩 Oxirgi so'z sizniki.",
  mafia: "Kimni o'ldirishni taklif qiling. Oxirgi so'z Donda.",
  advokat: 'Bu tun kimni himoya qilasiz?',
  komissar: "Rejimni tanlang va o'yinchini bosing.",
  doktor: 'Bu tun kimni qutqarasiz?',
  qoriqchi: "Kimning oldiga borib qo'riqlaysiz?",
  mashuqa: 'Kimni bir sutkaga band qilasiz? 💃🏼',
  daydi: 'Kimning uyiga shisha so\'rab kirasiz?',
  jurnalist: 'Ikki kishini tanlang.',
  qotil: "Bu tun kimni o'ldirasiz? 🔪",
  serjant: "Komissar ishlayapti. Uning natijalari pastda chiqadi.",
};

function hintText() {
  const s = state, me = s.me;
  if (s.phase === 'lobby') {
    if (!me.joined) return "O'yinga qo'shiling 👇";
    const need = s.minPlayers - s.players.length;
    if (me.id === s.hostId) return need > 0 ? `Yana ${need} kishi kerak. Do'stlaringizni chaqiring!` : `Hamma tayyor bo'lsa, o'yinni boshlang (eng ko'pi ${s.maxPlayers} kishi).`;
    return "O'yin egasi boshlashini kuting…";
  }
  if (s.phase === 'end') return "Yangi o'yin uchun guruhda /newgame yozing.";
  if (!me.joined) return '';
  if (s.phase === 'kamikaze') {
    return s.kamikazeId === me.id ? "💣 Siz portlayapsiz! O'zingiz bilan kimni olib ketasiz?" : `💣 ${nameOf(s.kamikazeId)} kimnidir tanlamoqda…`;
  }
  if (!me.alive) return "Siz o'ldingiz 💀 Kuzatishingiz mumkin, lekin maslahat bermang!";
  if (s.phase === 'night') {
    const base = NIGHT_HINT[me.role];
    if (!base) return "Shahar uxlayapti… 😴 Tong otishini kuting.";
    if (me.role === 'jurnalist') return `${base} (${(me.choice?.targets || pending).length}/2)`;
    return me.choice ? `${base} Tanlovni o'zgartirish mumkin.` : base;
  }
  if (me.blocked) return "💃🏼 Ma'shuqa sizni band qildi — bugun ovoz bera olmaysiz.";
  if (s.phase === 'day') return '🗣 Guruhda muhokama qiling: kim jinoyatchi?';
  if (s.phase === 'vote') return me.choice ? "Ovozingiz qabul qilindi. Boshqasini bosib o'zgartirish mumkin." : "Kimni osamiz? O'yinchini bosing.";
  return '';
}

// ---------- Chizish ----------
function render() {
  const s = state, me = s.me;
  document.body.dataset.phase = s.phase;
  const titles = {
    lobby: "🎭 Ro'yxatdan o'tish", night: `🌙 ${s.round}-tun`, day: `☀️ ${s.round}-kun`,
    vote: '🗳 Ovoz berish', kamikaze: '💣 Kamikadze', end: "O'yin tugadi",
  };
  $('phase').textContent = titles[s.phase];
  const alive = s.players.filter((p) => p.alive).length;
  $('sub').textContent = s.phase === 'lobby' ? `${s.players.length} / ${s.maxPlayers} o'yinchi` : `Tirik: ${alive} / ${s.players.length}`;
  if (s.spectators) $('sub').append(el('span', 'spect', `👀 ${s.spectators}`));

  // G'olib
  const w = $('winner'); w.replaceChildren();
  if (s.phase === 'end' && s.winner) {
    const texts = { civil: "🎉 Tinch aholi g'alaba qozondi!", mafia: "🎩 Mafia g'alaba qozondi!", qotil: "🔪 Qotil g'alaba qozondi!", draw: "🤝 Durang" };
    const b = el('div', `winner ${s.winner}`, texts[s.winner]);
    const mine = s.players.find((p) => p.id === me.id);
    if (mine) b.append(el('small', '', mine.winner ? 'Siz yutdingiz! 🏆' : mine.hero ? 'Siz qahramonsiz! 🎖' : 'Bu safar omad kulmadi'));
    w.append(b);
  }

  // Rol kartasi
  const rc = $('rolecard');
  rc.hidden = !me.role;
  if (me.role) {
    const r = s.roles[me.role];
    rc.className = `rolecard side-${r.side}` + (rc.classList.contains('open') ? ' open' : '');
    $('roleEmoji').textContent = r.emoji;
    $('roleName').textContent = r.name;
    $('roleInfo').textContent = r.info;
  }

  $('hint').textContent = hintText();
  $('watch').hidden = me.joined || s.phase === 'lobby';

  // Komissar rejimi
  const modes = $('modes'); modes.replaceChildren();
  if (s.phase === 'night' && me.role === 'komissar' && me.canAct) {
    for (const [mode, text] of [['check', '🔍 Tekshirish'], ['shoot', '🔫 Otish']]) {
      const b = el('button', 'btn' + (komMode === mode ? '' : ' ghost'), text);
      b.onclick = () => {
        komMode = mode;
        tg?.HapticFeedback?.impactOccurred('light');
        if (me.choice?.targets?.[0] != null) sendMsg({ type: 'act', targets: me.choice.targets, mode });
        render();
      };
      modes.append(b);
    }
  }

  // O'yinchilar
  const chosen = new Set(me.role === 'jurnalist' && s.phase === 'night' && pending.length ? pending : me.choice?.targets || []);
  const grid = $('grid'); grid.replaceChildren();
  for (const p of s.players) {
    const c = el('div', 'player');
    if (fx.enter.has(p.id)) c.classList.add('enter');
    if (!sceneOpen && fx.dying.has(p.id)) c.classList.add('dying');
    if (!p.alive) c.classList.add('dead');
    if (p.winner) c.classList.add('won');
    const selectable = canTarget(p);
    if (selectable) c.classList.add('selectable');
    if (chosen.has(p.id)) c.classList.add('selected');
    c.append(avatar(p), el('div', 'name', p.id === me.id ? `${p.name} (siz)` : p.name));

    let tag = '';
    if (p.role && (p.id !== me.id || !p.alive || s.phase === 'end')) tag = label(p.role);
    if (!p.alive) tag = `💀 ${tag}`;
    c.append(el('div', 'tag', tag));

    if (p.id === s.hostId) c.append(el('div', 'badge left', '👑'));
    if (p.winner) c.append(el('div', 'badge', '🏆'));
    else if (p.hero) c.append(el('div', 'badge', '🎖'));
    else if (p.hasVoted) c.append(el('div', 'badge', '✅'));
    if (p.votes) c.append(el('div', 'votes' + (fx.bump.has(p.id) ? ' bump' : ''), p.votes));
    if (p.voters.length) c.append(el('div', 'voters', `🗳 ${p.voters.map(nameOf).join(', ')}`));
    const picks = s.teamPicks.filter((x) => x.target === p.id);
    if (picks.length) c.append(el('div', 'picks', picks.map((x) => `${x.don ? '🎩' : '🤵🏻'} ${nameOf(x.from)}`).join(', ')));

    if (selectable) c.onclick = () => onPick(p);
    grid.append(c);
  }
  fx.enter.clear();
  fx.bump.clear();
  if (!sceneOpen) {
    if (fx.dying.size) tg?.HapticFeedback?.impactOccurred('heavy');
    fx.dying.clear();
  }

  // Tugmalar
  const act = $('actions'); act.replaceChildren();
  const button = (text, onClick, ghost, disabled) => {
    const b = el('button', 'btn' + (ghost ? ' ghost' : ''), text);
    b.onclick = () => { tg?.HapticFeedback?.impactOccurred('light'); onClick(); };
    b.disabled = !!disabled;
    act.append(b);
  };
  if (s.phase === 'lobby') {
    if (!me.joined) button("✅ Qo'shilish", () => sendMsg({ type: 'join' }), false, s.players.length >= s.maxPlayers);
    if (me.id === s.hostId) button("▶️ O'yinni boshlash", () => sendMsg({ type: 'start' }), false, s.players.length < s.minPlayers);
    if (me.joined) button('Chiqish', () => sendMsg({ type: 'leave' }), true);
  }
  if (s.phase === 'day' && me.id === s.hostId) button("⏭ Ovoz berishga o'tish", () => sendMsg({ type: 'skipDay' }), true);
  if (s.phase === 'vote' && me.canAct) {
    button(`🤷 Hech kim${s.skipVotes ? ` (${s.skipVotes})` : ''}`, () => sendMsg({ type: 'vote', target: 'skip' }), !me.choice?.skip);
  }
  if (s.phase === 'vote' && s.skipVoters.length) {
    act.append(el('div', 'skipline', `🤷 Hech kimga: ${s.skipVoters.map(nameOf).join(', ')}`));
  }
  if (s.phase === 'end') button('Yopish', () => tg?.close(), true);

  // Shaxsiy xabarlar
  $('notes').hidden = !s.notes.length;
  const nl = $('noteList'); nl.replaceChildren();
  for (const n of [...s.notes].reverse()) {
    const li = el('li');
    li.append(el('span', 'r', `${n.round}-tun`), document.createTextNode(n.text));
    nl.append(li);
  }

  // Komissar tekshiruvlari
  $('checks').hidden = !s.checks.length;
  const cl = $('checkList'); cl.replaceChildren();
  s.checks.forEach((c, i) => {
    const row = el('div', 'row');
    row.append(el('span', '', `${c.round}-tun: ${nameOf(c.target)} — ${label(c.role)}`));
    if (c.revealed) row.append(el('span', 'r', "📢 e'lon qilingan"));
    else if (s.canReveal) {
      const b = el('button', 'btn small', "📢 E'lon qilish");
      b.onclick = () => { tg?.HapticFeedback?.impactOccurred('medium'); sendMsg({ type: 'reveal', index: i }); };
      row.append(b);
    }
    cl.append(row);
  });

  // Voqealar
  const log = $('log'); log.replaceChildren();
  for (const item of [...s.log].reverse()) log.append(el('li', '', item.text));

  tickTimer();
}

function tickTimer() {
  const t = $('timer');
  if (!endAt) { t.textContent = ''; return; }
  const sec = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  t.textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
  t.classList.toggle('low', sec <= 10);
  if (state?.duration) t.style.setProperty('--p', Math.max(0, Math.min(100, ((endAt - Date.now()) / state.duration) * 100)));
}
setInterval(tickTimer, 250);

$('rolecard').onclick = () => { $('rolecard').classList.toggle('open'); tg?.HapticFeedback?.impactOccurred('medium'); };

connect();
</script>
</body>
</html>
